[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ac820-leaf-pynq"
version = "0.1.0"
description = "PYNQ host port for the AC820 six-class leaf classifier"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
